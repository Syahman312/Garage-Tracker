// 'eir'  = agreements under the Hire-Purchase (Amendment) Act 2026 (from 1 June 2026): reducing balance,
//          interest each month = outstanding balance x EIR / 12; settling early means paying the outstanding balance.
// 'flat' = older agreements: flat rate on the original amount, early settlement rebate by the Rule of 78.
const LOANCUT='2026-06-01';
const pmt=(P,r,n)=>r>0?P*r/(1-Math.pow(1+r,-n)):P/n,
addM=(d,k)=>{const x=new Date(d+'T00:00'),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+k);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return iso(x)},

// Monthly rate that makes a reducing-balance loan of P over n months cost `inst` a month (used to show the EIR of a flat-rate loan).
function eirOf(P,n,inst){if(!(P>0&&n>0&&inst>0)||inst*n<=P)return 0;let lo=0,hi=.1;for(let i=0;i<80;i++){const m=(lo+hi)/2;pmt(P,m,n)>inst?hi=m:lo=m}return (lo+hi)/2*1200}

if(flat){const TI=P*rate*n/12,inst=+L.inst||(P+TI)/n,S=n*(n+1)/2,k0=Math.min(n,dueBy(d0,asOf)),k=n-k0,reb=TI*k*(k+1)/(n*(n+1));
let ip=0;for(let i=1;i<=k0;i++)ip+=TI*(n-i+1)/S;
for(let i=0;i<=n;i++){const kk=n-i;out.rows.push({d:addM(d0,i-1),bal:Math.max(0,kk*inst-TI*kk*(kk+1)/(n*(n+1)))})}
Object.assign(out,{inst,TI,paidN:k0,leftN:k,intPaid:ip,intLeft:TI-ip,settle:Math.max(0,k*inst-reb),rebate:reb,eir:eirOf(P,n,inst),total:inst*n});return out}
const r=rate/12,inst=+L.inst||pmt(P,r,n),pre=L.pre||{},k0=dueBy(d0,asOf);let bal=P,ip=0,it=0,i=0,paidN=0,balNow=P,intPaid=0;out.rows.push({d:addM(d0,-1),bal:P});
while(bal>0.005&&i<n+600){const d=addM(d0,i),iv=bal*r,pay=Math.min(inst,bal+iv);bal=bal+iv-pay;it+=iv;
Object.entries(pre).forEach(([pd,a])=>{if(pd>addM(d0,i-1)&&pd<=d)bal=Math.max(0,bal-(+a||0))});i++;out.rows.push({d,bal});if(d<=asOf){paidN=i;balNow=bal;intPaid=it}}
if(k0===0){balNow=P;intPaid=0}
Object.assign(out,{inst,paidN,leftN:Math.max(0,i-paidN),intPaid,intLeft:it-intPaid,TI:it,settle:balNow,eir:rate*100,total:P+it,end:addM(d0,i-1),months:i});return out}
